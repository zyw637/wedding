<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title data-i18n="meta.title">婚礼邀请函 · 万卓洋 ＆ 张佳敏</title>

  <!-- Preload Essential Gallery Images -->
  <link rel="preload" as="image" href="./src/assets/images/相爱/1.jpg">
  <link rel="preload" as="image" href="./src/assets/images/相守/1.jpg">

  <!-- Neo-Chinese Palace & Vertical Gallery Stylesheet -->
  <link rel="stylesheet" href="./src/styles/theme-chinese.css">

  <!-- AMap Security Config (密钥必须配置在 JS API 加载之前) -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: "4c24a838766deb5f8fa157772c26a7fc" };
  </script>

  <!-- Inline so the loading layer appears before theme assets finish loading. -->
  <style>
    #pageLoader {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: grid;
      place-items: center;
      background: #1a0a0c;
      color: #e6c27a;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    #pageLoader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #pageLoader .page-loader-inner {
      display: grid;
      justify-items: center;
      gap: 14px;
      font-family: serif;
      letter-spacing: 0.22em;
      font-size: 0.68rem;
    }

    #pageLoader .page-loader-ring {
      width: 42px;
      height: 42px;
      border: 2px solid rgba(230, 194, 122, 0.22);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: pageLoaderSpin 0.9s linear infinite;
    }

    @keyframes pageLoaderSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="chinese-theme chinese-locked">

  <div
    id="pageLoader"
    role="status"
    aria-live="polite"
    aria-label="正在加载请帖"
    data-critical="./src/assets/images/相爱/1.jpg,./src/assets/images/相守/1.jpg"
  >
    <div class="page-loader-inner">
      <div class="page-loader-ring" aria-hidden="true"></div>
      <span>正在展开请帖 · PLEASE WAIT</span>
    </div>
  </div>

  <!-- Fullscreen "天降吉囍" Falling Character Physics Canvas -->
  <canvas id="xiCanvas" style="position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;" aria-hidden="true"></canvas>

  <!-- Top Floating Nav Controls -->
  <nav class="chinese-nav-bar" aria-label="Quick Controls">
    <button class="chinese-music-btn" id="chineseMusicBtn" aria-label="Music Toggle">
      <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
  </nav>

  <!-- 00. 3D SILK SCROLL OPENING CEREMONY (3D 锦缎画轴展开) -->
  <div class="scroll-overlay" id="scrollOverlay">
    <header class="scroll-header-intro">
      <div class="scroll-calligraphy-title" data-i18n="scroll.calligraphyTitle"></div>
      <div class="scroll-subtitle" data-i18n="scroll.subtitle"></div>
    </header>

    <!-- 3D Scroll Rollers Frame -->
    <div class="scroll-wrapper" id="scrollWrapper" role="button" aria-label="Touch Seal to Unroll Silk Scroll">
      <!-- Middle Xuan Paper Unrolled -->
      <div class="scroll-paper-body">
        <div class="scroll-poem-line" data-i18n="scroll.poemLine"></div>
        <div class="scroll-poem-sub" data-i18n="scroll.poemSub"></div>
      </div>

      <!-- Left & Right Wooden Rollers -->
      <div class="scroll-roller-left"></div>
      <div class="scroll-roller-right"></div>

      <!-- Red Cinnabar Seal in Center -->
      <div class="scroll-seal-stamp" data-i18n="scroll.sealText">囍</div>
    </div>

    <div class="scroll-hint-bar" data-i18n="scroll.hint"></div>
  </div>

  <!-- MAIN SCROLLABLE CONTENT (殿堂级金石画境长卷) -->
  <main class="palace-art-container">

    <!-- 01. IMPERIAL MARRIAGE DECREE (大喜婚书名帖) -->
    <section class="palace-card">
      <div class="fret-corner fret-tl"></div>
      <div class="fret-corner fret-tr"></div>
      <div class="fret-corner fret-bl"></div>
      <div class="fret-corner fret-br"></div>

      <div class="palace-stamp-emblem">囍</div>
      <div class="palace-lead-title" data-i18n="decree.leadTitle"></div>
      <h1 class="palace-couple-names" data-i18n="decree.names"></h1>
      <div class="palace-couple-en" data-i18n="decree.namesEn"></div>

      <div class="palace-gold-ruler">✦</div>

      <p class="palace-classical-vow" data-i18n="decree.vow" style="white-space: pre-line;"></p>
    </section>

    <!-- 02. CELESTIAL EARTHLY BRANCHES COMPASS (十二时辰吉时乾坤天象罗盘) -->
    <section class="palace-card compass-section">
      <div class="fret-corner fret-tl"></div>
      <div class="fret-corner fret-tr"></div>
      <div class="fret-corner fret-bl"></div>
      <div class="fret-corner fret-br"></div>

      <div class="compass-tag" data-i18n="compass.tag"></div>
      <h2 class="compass-title" data-i18n="compass.title"></h2>

      <!-- Concentric Spinning Heavenly Compass -->
      <div class="compass-dial-box" id="compassDial">
        <div class="compass-orbit-branches"></div>
        <div class="compass-orbit-inner"></div>
        <div class="compass-core-info">
          <div class="compass-solar-date" data-i18n="compass.solarDate"></div>
          <div class="compass-lunar-date" data-i18n="compass.lunarDate"></div>
        </div>
      </div>

      <!-- 4 Palace Lantern Countdown Blocks -->
      <div class="compass-countdown-grid">
        <div class="compass-box">
          <span class="compass-num" id="compassDays">00</span>
          <span class="compass-unit" data-i18n="compass.days"></span>
        </div>
        <div class="compass-box">
          <span class="compass-num" id="compassHours">00</span>
          <span class="compass-unit" data-i18n="compass.hours"></span>
        </div>
        <div class="compass-box">
          <span class="compass-num" id="compassMins">00</span>
          <span class="compass-unit" data-i18n="compass.minutes"></span>
        </div>
        <div class="compass-box">
          <span class="compass-num" id="compassSecs">00</span>
          <span class="compass-unit" data-i18n="compass.seconds"></span>
        </div>
      </div>
    </section>

    <!-- 03. VERTICAL PHOTO SHOWCASES (相爱与相守) -->
    <section class="palace-gallery-flow">

      <!-- Showcase 1: 相爱 · 初见成诗 -->
      <article class="chateau-showcase-card" id="showcase1">
        <header class="chateau-showcase-header">
          <span class="showcase-tag" data-i18n="gallery.sec1Tag"></span>
          <h2 class="showcase-title" data-i18n="gallery.sec1Title"></h2>
        </header>

        <div class="showcase-photo-frame" role="group" aria-label="相爱照片轮播">
          <img class="showcase-photo" src="./src/assets/images/相爱/1.jpg" alt="相爱照片 1" />
          <img class="showcase-photo" src="./src/assets/images/相爱/2.jpg" alt="相爱照片 2" style="display: none;" />
        </div>

        <div class="showcase-dots" aria-hidden="true">
          <span class="showcase-dot active"></span>
          <span class="showcase-dot"></span>
        </div>

        <div class="showcase-quote" data-i18n="gallery.sec1Quote"></div>
        <div class="showcase-swipe-hint" data-i18n="gallery.swipeHint"></div>
      </article>

      <!-- Showcase 2: 相守 · 朝暮同途 -->
      <article class="chateau-showcase-card" id="showcase2">
        <header class="chateau-showcase-header">
          <span class="showcase-tag" data-i18n="gallery.sec2Tag"></span>
          <h2 class="showcase-title" data-i18n="gallery.sec2Title"></h2>
        </header>

        <div class="showcase-photo-frame" role="group" aria-label="相守照片轮播">
          <img class="showcase-photo" src="./src/assets/images/相守/1.jpg" alt="相守照片 1" />
          <img class="showcase-photo" src="./src/assets/images/相守/2.jpg" alt="相守照片 2" style="display: none;" />
        </div>

        <div class="showcase-dots" aria-hidden="true">
          <span class="showcase-dot active"></span>
          <span class="showcase-dot"></span>
        </div>

        <div class="showcase-quote" data-i18n="gallery.sec2Quote"></div>
        <div class="showcase-swipe-hint" data-i18n="gallery.swipeHint"></div>
      </article>

    </section>

    <!-- 04. LOCATION & BANQUET (盛宴席设与地图) -->
    <section class="palace-card location-card">
      <div class="fret-corner fret-tl"></div>
      <div class="fret-corner fret-tr"></div>
      <div class="fret-corner fret-bl"></div>
      <div class="fret-corner fret-br"></div>

      <div class="compass-tag" data-i18n="banquet.tag"></div>
      <h2 class="compass-title" style="font-size: 1.6rem;" data-i18n="banquet.title"></h2>

      <div class="banquet-info-grid">
        <div class="banquet-info-row">
          <span class="banquet-info-label" data-i18n="banquet.dateLabel"></span>
          <span class="banquet-info-value" data-i18n="meta.dateFormatted"></span>
          <span class="banquet-info-sub" data-i18n="meta.lunarDate"></span>
        </div>

        <div class="banquet-info-row">
          <span class="banquet-info-label" data-i18n="banquet.timeLabel"></span>
          <span class="banquet-info-value" data-i18n="meta.timeFormatted"></span>
        </div>

        <div class="banquet-info-row">
          <span class="banquet-info-label" data-i18n="banquet.venueLabel"></span>
          <span class="banquet-info-value" data-i18n="meta.venueName"></span>
        </div>

      </div>

      <!-- Embedded AMap Venue Map -->
      <div class="chateau-map-frame" id="chineseMapFrame">
        <div id="chineseMap" class="chateau-map-canvas" role="img" aria-label="婚礼场地地图"></div>
        <div class="chateau-map-caption" data-i18n="banquet.mapCaption"></div>
      </div>

      <div class="banquet-btn-row">
        <button class="btn-palace-gold btn-palace-primary" id="btnChineseNav" data-i18n="banquet.navBtn"></button>
        <button class="btn-palace-gold btn-palace-secondary" id="btnChineseCopy" data-i18n="banquet.copyBtn"></button>
      </div>

      <div style="font-size: 0.76rem; color: var(--ch-text-subtle); margin-top: 16px;" data-i18n="banquet.tip"></div>
    </section>

    <!-- 05. CLOSING & WISHES (尾声与回顶) -->
    <footer class="palace-closing-footer">
      <div class="footer-dragon-phoenix" data-i18n="footer.dragonPhoenix"></div>
      <p class="footer-auspicious-wish" data-i18n="footer.blessing"></p>
      <div class="footer-couple-seal-sign" data-i18n="footer.sign"></div>

      <button class="btn-scroll-head" id="btnChineseTop" data-i18n="footer.scrollTop"></button>
    </footer>

  </main>

  <!-- Lightweight Neo-Chinese JavaScript Bundle -->
  <script src="./src/scripts/page-loader.js"></script>
  <script src="./src/scripts/chinese-bundle.js"></script>
</body>
</html>
